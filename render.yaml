services:
  - type: web
    name: newqr
    runtime: python
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    # The WSGI entry point is the top-level wsgi.py module.
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
